<body>
  <header><a class="brand" href="/"><img src="/horse.svg" alt="" width="36" height="36">reverse.horse</a><nav aria-label="Main"><a href="/">Answer</a><a href="/request" aria-current="page">Question</a><a href="/help">Help</a></nav></header>
  <main>
    <div class="toolbar"><div><h1>Question</h1><p>Write it once. Ask again whenever you want.</p></div><a href="/" target="_blank" rel="noopener" class="source">Open answering screen in another tab</a></div>
    <p id="library-error" role="alert" hidden></p>
    <section id="new-question" aria-label="New question"></section>
    <section id="saved-questions" aria-label="Saved questions"></section>
    <template id="question-editor">
    <div class="builder-layout question-editor">
      <form id="builder">
        <fieldset id="draft" class="draft">
          <section class="builder-panel">
            <label class="field">State format<select id="state-format" aria-label="State format"><option value="text">Text</option><option value="json">JSON</option></select></label>
            <label class="field">State<textarea id="state" rows="5" required placeholder="The situation you want someone to evaluate…"></textarea></label>
          </section>
          <div id="questions"></div>
          <button id="add-question" type="button" class="secondary">Add question</button>
        </fieldset>
        <p id="builder-error" role="alert" hidden></p>
        <div class="actions builder-actions"><p>Saved in this browser. Replies are averaged.</p><div class="question-buttons"><button id="save" type="button" class="secondary">Save</button><button id="send" type="submit">Send</button></div></div>
      </form>
      <aside>
        <section class="builder-panel"><div class="panel-heading"><h2>Request JSON</h2><button id="copy-json" type="button" class="secondary">Copy</button></div><textarea id="preview" rows="17" readonly aria-label="Generated request JSON" spellcheck="false"></textarea><p id="copy-status" role="status"></p></section>
      </aside>
    </div>
    </template>
    <section id="curl-example" class="builder-panel" aria-label="Curl example"></section>
  </main>
  <footer>reverse.horse <span>One request. Human judgment.</span></footer>
