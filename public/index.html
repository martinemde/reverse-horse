<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#131718">
  <title>Meat Jev</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header><a class="brand" href="/">Meat Jev<span> HUMAN INFERENCE</span></a><nav aria-label="Main"><a href="/" aria-current="page">Answer</a><a href="/request">Make a request</a></nav><span id="connection" role="status">Connecting…</span></header>
  <main>
    <div class="toolbar"><div><h1>You are the model.</h1><p>Read the state. Make the call.</p></div><label class="auto"><input id="auto" type="checkbox" disabled> Auto mode <small>Deal me examples</small></label></div>
    <div class="auth-bar"><p id="auth-status" role="status">Connect your OpenRouter account to compare with JEV.</p><label class="compare-toggle"><input id="compare" type="checkbox" disabled> Compare with JEV</label><button id="auth" type="button" class="secondary">Connect OpenRouter</button></div>
    <p id="error" role="alert" hidden></p>
    <section id="requests" aria-label="Waiting requests"><div class="empty"><div class="waiting-mark">?</div><h2>No questions yet</h2><p>Waiting for a request, or turn on auto mode.</p></div></section>
    <section id="results" aria-label="Your results" hidden><h2 class="section-title">You & JEV</h2><div id="history"></div></section>
  </main>
  <footer>Meat Jev <span>30 seconds. One human. Your judgment.</span></footer>
</body>
</html>
